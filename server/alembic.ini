# Alembic configuration for Zanbeel.
#
# The schema was previously patched by seventeen hand-written ALTER TABLE
# functions that ran at every startup, each swallowing its own errors. Those
# still run so an existing deployment upgrades in place, but every schema change
# from here on belongs in a revision under alembic/versions/ — reviewable in a
# diff, applied once, and recorded in alembic_version.
#
# The database URL is not written here. env.py reads it from DATABASE_URL so
# there is one source of truth and no credentials in a tracked file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
